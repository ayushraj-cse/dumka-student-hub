<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dumka Student Hub</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Top bar: visible everywhere, holds the identity + current section title -->
<header class="topbar">
  <div class="topbar-inner">
    <span class="brand">Dumka Student Hub</span>
    <span class="topbar-section" id="topbarSection">Home</span>
  </div>
</header>

<div class="shell">

  <!-- Desktop/tablet sidebar -->
  <nav class="sidebar" aria-label="Main sections">
    <button class="sidebar-link" data-route="home">Home</button>
    <button class="sidebar-link" data-route="timetable">Class Timetable</button>
    <button class="sidebar-link" data-route="transport">Bus &amp; Train Times</button>
    <button class="sidebar-link" data-route="alerts">Local Alerts</button>
    <button class="sidebar-link" data-route="essentials">Nearby Essentials</button>
    <button class="sidebar-link" data-route="mess">Mess Menu &amp; Complaints</button>
    <button class="sidebar-link" data-route="notes">Notes Exchange</button>
    <button class="sidebar-link" data-route="lostfound">Lost &amp; Found</button>
    <button class="sidebar-link" data-route="notices">Notice Board</button>
    <button class="sidebar-link" data-route="expenses">Expense Tracker</button>
    <button class="sidebar-link" data-route="deadlines">Deadlines</button>
    <button class="sidebar-link" data-route="contacts">Emergency Contacts</button>
  </nav>

  <main class="content" id="content">
    <!-- sections injected by app.js -->
  </main>

</div>

<!-- Mobile bottom tab bar: 4 most-used tools + More -->
<nav class="tabbar" aria-label="Quick navigation">
  <button class="tab" data-route="home">
    <span class="tab-icon" aria-hidden="true">&#8962;</span>
    <span class="tab-label">Home</span>
  </button>
  <button class="tab" data-route="timetable">
    <span class="tab-icon" aria-hidden="true">&#128197;</span>
    <span class="tab-label">Classes</span>
  </button>
  <button class="tab" data-route="alerts">
    <span class="tab-icon" aria-hidden="true">&#9888;</span>
    <span class="tab-label">Alerts</span>
  </button>
  <button class="tab" data-route="essentials">
    <span class="tab-icon" aria-hidden="true">&#128205;</span>
    <span class="tab-label">Nearby</span>
  </button>
  <button class="tab" data-route="more">
    <span class="tab-icon" aria-hidden="true">&#8942;</span>
    <span class="tab-label">More</span>
  </button>
</nav>

<!-- "More" sheet for the remaining tools, mobile only -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="moreSheet" role="dialog" aria-label="More tools">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title">More tools</h2>
  <button class="sheet-link" data-route="transport">Bus &amp; Train Times</button>
  <button class="sheet-link" data-route="mess">Mess Menu &amp; Complaints</button>
  <button class="sheet-link" data-route="notes">Notes Exchange</button>
  <button class="sheet-link" data-route="lostfound">Lost &amp; Found</button>
  <button class="sheet-link" data-route="notices">Notice Board</button>
  <button class="sheet-link" data-route="expenses">Expense Tracker</button>
  <button class="sheet-link" data-route="deadlines">Deadlines</button>
  <button class="sheet-link" data-route="contacts">Emergency Contacts</button>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
